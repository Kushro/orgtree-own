name: Spike Tauri 2

on:
  push:
    branches: [spike/tauri]
    paths:
      - apps/desktop-tauri/**
      - .github/workflows/spike-tauri.yml
  pull_request:
    paths:
      - apps/desktop-tauri/**
      - .github/workflows/spike-tauri.yml
  workflow_dispatch:

concurrency:
  group: spike-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      - name: Install Tauri CLI
        run: npm ci

      - name: Build installer
        run: npx tauri build --ci

      - name: Smoke test (window starts and stays up)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release -Filter orgtree-tauri.exe | Select-Object -First 1
          if (-not $exe) { throw "orgtree-tauri.exe not found" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          if ($p.HasExited) { throw "app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "App stayed up for 15 s"

      - name: Report sizes
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/orgtree-tauri.exe |
            ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) } |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: orgtree-tauri-installer
          path: apps/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
