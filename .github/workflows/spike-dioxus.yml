name: Spike Dioxus

on:
  push:
    branches: [spike/dioxus]
    paths:
      - apps/desktop-dioxus/**
      - apps/desktop/renderer/src/styles.css
      - .github/workflows/spike-dioxus.yml
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publicar el instalador como pre-release de GitHub (tag dioxus-preview-<run_number>)'
        type: boolean
        default: false

concurrency:
  group: spike-dioxus-${{ github.ref }}
  cancel-in-progress: true

env:
  DIOXUS_CLI_VERSION: 0.7.10

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop-dioxus
    steps:
      # El submódulo engine/mailhub va en el instalador (#24).
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop-dioxus
            engine/native/pg-custodian -> ../../../artifacts/postgres-provision/cargo

      # Python para el motor real en modo de desarrollo (pruebas y smoke test) y para
      # aprovisionar el runtime embebido. Raíz de datos descartable, nunca datos reales.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'

      - name: Install engine dependencies
        run: python -m pip install -r ../../tools/runtime-requirements.in

      - name: Engine supervisor and client tests (fake and real engine)
        env:
          FAKE_ENGINE_PYTHON: ${{ steps.python.outputs.python-path }}
          ORGTREE_TEST_ENGINE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo test -p orgtree-engine-host -p orgtree-engine-client -- --include-ignored --nocapture

      # #27: Markdown y enlaces a archivos, revelado (rutas relativas o inexistentes) y hora local
      - name: Desk unit tests
        run: cargo test -p orgtree-dioxus --bin orgtree-dioxus

      # #24: el runtime embebido y PostgreSQL 18, como el instalador de Electron.
      # El ZIP de PostgreSQL (~380 MB) queda en caché por el pin.
      - uses: actions/cache@v4
        with:
          path: .runtime-cache/*.zip
          key: runtime-cache-${{ hashFiles('tools/postgres-runtime-pin.json', 'tools/provision-runtime.py') }}

      - name: Provision the embedded Python runtime (engine/runtime)
        working-directory: .
        run: python tools/provision-runtime.py

      - name: Provision PostgreSQL and pg-custodian (engine/postgresql, engine/pg-custodian.exe)
        working-directory: .
        run: python tools/provision-postgres.py

      - name: Stage the installer resources
        working-directory: .
        run: python apps/desktop-dioxus/installer/stage_resources.py

      # Las mismas verificaciones de disposición que tools/package-preflight.mjs,
      # sobre lo que va al instalador.
      - name: Verify the staged runtime and PostgreSQL layout
        working-directory: .
        run: >-
          node --input-type=module -e "import { assertRuntimeLayout } from './tools/runtime-layout.mjs';
          import { assertPostgresRuntime } from './tools/postgres-layout.mjs';
          const engine = 'apps/desktop-dioxus/target/bundle-resources/engine';
          assertRuntimeLayout(engine + '/runtime', { label: 'staged runtime' });
          console.log('runtime ok', JSON.stringify(assertPostgresRuntime(engine, { sourceRoot: process.cwd() })))"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli@${{ env.DIOXUS_CLI_VERSION }} --no-confirm --force

      - name: Build installer
        run: dx bundle --platform desktop --package-types nsis --release --out-dir dist

      - name: Smoke test (engine, home, org chart, inbox and attention, full desk, desk window and native integration in RSX)
        shell: pwsh
        env:
          ORGTREE_DIOXUS_PYTHON: ${{ steps.python.outputs.python-path }}
          # El motor real con una org sembrada (un agente con historial) y sin proveedores.
          ORGTREE_DIOXUS_ENGINE_DIR: ${{ github.workspace }}/apps/desktop-dioxus/fixture-engine
          ORGTREE_DIOXUS_DATA: ${{ runner.temp }}/orgtree-dioxus-smoke
          ORGTREE_DIOXUS_PROBE: ${{ runner.temp }}/orgtree-dioxus-probe.json
          # Desk en vivo (#12): frames node_stream simulados y una conversación larga.
          # Desk completo (#27): el fixture siembra mail, avisos, pensamiento y archivos,
          # y simula los estados del turno (POST /api/fixture/turn-state).
          # Bandeja y atención (#28): POST /api/fixture/attention hace que el agente le
          # escriba al usuario, le pregunte y levante la bandera en dos tickets.
          ORGTREE_FIXTURE_LIVE: '1'
          ORGTREE_FIXTURE_MESSAGES: '1200'
        run: |
          $exe = Get-ChildItem target -Recurse -Filter orgtree-dioxus.exe |
            Where-Object { $_.FullName -match '\\release\\' } | Select-Object -First 1
          if (-not $exe) { throw "orgtree-dioxus.exe not found" }
          Write-Host "Running $($exe.FullName)"
          # #27: ningún enlace del desk abre el navegador (Dioxus manda cada <a> clicado a webbrowser::open)
          $browsersBefore = @(Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue).Count
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\screens" | Out-Null
            $bitmap.Save("$env:RUNNER_TEMP\screens\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose()
          }
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class Win {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X, Y; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr h, ref POINT p);
            [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, IntPtr e);
          }
          '@
          $ci = @{}
          # #14: arrastrar la ventana con el mouse real desde el header (zona -webkit-app-region: drag)
          function Test-Drag {
            $probe = Get-Content $env:ORGTREE_DIOXUS_PROBE -Raw | ConvertFrom-Json
            $nat = $probe.native
            $hwnd = [IntPtr][long]$nat.shell.hwnd
            # tao deja WS_CAPTION (snap, animaciones) y quita la barra de título. Queda el borde
            # de redimensionado invisible de Windows (8 px por lado, dentro del rectángulo de la
            # ventana en el tao de Dioxus); una barra de título real suma unos 30 px de alto.
            $wr = New-Object Win+RECT; [void][Win]::GetWindowRect($hwnd, [ref]$wr)
            $cr = New-Object Win+RECT; [void][Win]::GetClientRect($hwnd, [ref]$cr)
            $ci.frame = "window $($wr.R - $wr.L)x$($wr.B - $wr.T), client $($cr.R)x$($cr.B)"
            $ci.framed = (($wr.B - $wr.T) - $cr.B) -ge 20
            $drag = $nat.page.drag
            if (-not $drag) { return }
            $before = New-Object Win+RECT; [void][Win]::GetWindowRect($hwnd, [ref]$before)
            $pt = New-Object Win+POINT; $pt.X = [int]($drag.x * $drag.dpr); $pt.Y = [int]($drag.y * $drag.dpr)
            [void][Win]::ClientToScreen($hwnd, [ref]$pt)
            [void][Win]::SetCursorPos($pt.X, $pt.Y); Start-Sleep -Milliseconds 200
            [Win]::mouse_event(0x2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 200
            for ($i = 1; $i -le 10; $i++) { [void][Win]::SetCursorPos($pt.X + 12 * $i, $pt.Y + 6 * $i); Start-Sleep -Milliseconds 40 }
            [Win]::mouse_event(0x4, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 500
            $after = New-Object Win+RECT; [void][Win]::GetWindowRect($hwnd, [ref]$after)
            $ci.dx = $after.L - $before.L; $ci.dy = $after.T - $before.T; $ci.at = "$($pt.X),$($pt.Y)"
          }
          $deadline = (Get-Date).AddSeconds(420)
          $shots = @{}
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            # la prueba deja un marcador y espera 3 s: capturas del inicio, del organigrama
            # (contratación, menú de agente, agente detenido), del desk (scroll, contenido,
            # en cola por el límite de turnos, detenido) y de las dos ventanas
            # #28: la barra de tareas parpadeando (ventana minimizada), la cola tras el clic en
            # la notificación, el panel de un ticket con bandera y la bandeja
            foreach ($name in 'home', 'chart-hire', 'chart-menu', 'chart', 'taskbar', 'notification-click', 'attention', 'inbox', 'desk', 'desk-content', 'desk-queued', 'desk-halted', 'popout') {
              if (-not $shots[$name] -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).$name")) {
                try { Save-Screen $name } catch { Write-Host "screenshot: $_" }; $shots[$name] = $true
              }
            }
            # #27: revelar un archivo abre su carpeta con el archivo seleccionado (explorer /select,)
            if (-not $shots['reveal'] -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).reveal")) {
              $shots['reveal'] = $true
              Start-Sleep -Milliseconds 1500
              try { Save-Screen 'reveal' } catch { Write-Host "screenshot: $_" }
              try {
                $explorer = @((New-Object -ComObject Shell.Application).Windows() | ForEach-Object { try { $_.Document.Folder.Self.Path } catch {} })
                $ci.explorer = $explorer -join ' | '
                $ci.revealedFolder = [bool]($explorer | Where-Object { $_ -and $_.TrimEnd('\') -like '*-fixture-files' })
                # cerrar esas ventanas para que no tapen el resto de la prueba
                (New-Object -ComObject Shell.Application).Windows() | Where-Object { try { $_.Document.Folder.Self.Path -like '*-fixture-files*' } catch { $false } } | ForEach-Object { $_.Quit() }
              } catch { $ci.explorer = "error: $_" }
            }
            if (-not $ci.native -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).native")) {
              $ci.native = $true
              try { Test-Drag } catch { $ci.dragError = "$_" }
              try { Save-Screen 'native' } catch { Write-Host "screenshot: $_" }
              New-Item -ItemType File "$($env:ORGTREE_DIOXUS_PROBE).native-done" | Out-Null
            }
            # Sin ventanas visibles la app sigue en la bandeja; una segunda ejecución la vuelve a mostrar.
            if (-not $ci.tray -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).tray")) {
              $ci.tray = $true
              $p.Refresh(); $ci.aliveInTray = -not $p.HasExited
              $second = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -ArgumentList '--second' -PassThru
              $ci.secondExited = $second.WaitForExit(20000)
              if (-not $ci.secondExited) { $second.Kill() }
              Start-Sleep -Milliseconds 800
              try { Save-Screen 'second-instance' } catch { Write-Host "screenshot: $_" }
            }
            Start-Sleep -Milliseconds 300; $p.Refresh()
          }
          # Salir (como desde la bandeja) termina la app, y con ella el motor.
          $exited = $p.HasExited
          if (-not (Test-Path $env:ORGTREE_DIOXUS_PROBE)) { throw "the WebView2 probe did not report" }
          $port = Join-Path $env:ORGTREE_DIOXUS_DATA 'engine-port.json'
          if (-not (Test-Path $port)) { throw "the app did not start the engine ($port missing)" }
          Write-Host "Engine started by the app: $(Get-Content $port -Raw)"
          $raw = Get-Content $env:ORGTREE_DIOXUS_PROBE -Raw
          Write-Host "WebView2 probe: $raw"
          "### WebView2 probe (Dioxus)`n``````json`n$raw`n``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $probe = $raw | ConvertFrom-Json
          $failures = @()
          if ($probe.error) { $failures += "probe error: $($probe.error)" }
          # #11: página de inicio en RSX con datos del cliente Rust
          $hp = $probe.home
          foreach ($check in 'card', 'orgListed', 'orgOpened', 'agentShown') {
            if ($hp.$check -ne $true) { $failures += "home.$check was $($hp.$check)" }
          }
          if ($hp.version -ne '0.0.1') { $failures += "version badge: $($hp.version)" }
          if ($hp.fontFamily -notlike '*Segoe UI*') { $failures += "renderer CSS not applied: $($hp.fontFamily)" }
          if ($hp.bridge -ne 'undefined') { $failures += "a desktop bridge leaked into the webview: $($hp.bridge)" }
          # #24: la raíz de datos en uso, a la vista en el inicio
          if ($hp.dataRoot -ne $env:ORGTREE_DIOXUS_DATA) { $failures += "data root not shown on the home card: $($hp.dataRoot)" }
          # #26: organigrama. Crear la org, contratar (el fixture declara un Claude stub),
          # detener y reanudar, mover y deshacer, retirar y recontratar, y borrar la org.
          $ch = $probe.chart
          foreach ($check in 'created', 'emptyTree', 'hiredTop', 'hiredSub', 'nested', 'externalShown', 'externalTop',
                             'halted', 'unhalted', 'interruptDisabledWhenIdle', 'moved', 'movedBack',
                             'retiredHidden', 'retiredShown', 'rehired', 'listed', 'deleted') {
            if ($ch.$check -ne $true) { $failures += "chart.$check was $($ch.$check)" }
          }
          if ($ch.orgName -ne 'Prueba Dioxus') { $failures += "org name in the orgbar: $($ch.orgName)" }
          if ($ch.bar -notlike '3 live*H3') { $failures += "orgbar agents chip: $($ch.bar)" }
          if ($ch.credits -ne "circulation 7 $([char]0xB7) seats 3 $([char]0xB7) free 4") { $failures += "orgbar credits: $($ch.credits)" }
          if ($ch.model -notlike 'claude-haiku*') { $failures += "model badge: $($ch.model)" }
          $ellipsis = [char]0x2026
          foreach ($entry in 'Open desk', "Hire a subordinate$ellipsis", "Move to$ellipsis", 'Interrupt (disabled)', 'Halt', "Retire$ellipsis") {
            if ($ch.menu -notcontains $entry) { $failures += "agent menu lacks '$entry': $($ch.menu -join ', ')" }
          }
          if ($ch.retireConfirm -notlike '*rehire brings it back*') { $failures += "retire confirm: $($ch.retireConfirm)" }
          if ($ch.missing) { $failures += "menu entries not found: $($ch.missing -join ', ')" }
          # sin sondeo: con la org quieta, cada relectura del árbol viene de un frame del WebSocket
          if (-not ($ch.idle.loads -le $ch.idle.frames)) { $failures += "the tree was re-read without a WebSocket frame: $($ch.idle | ConvertTo-Json -Compress)" }
          if (-not ($ch.loads -le $ch.frames + 1)) { $failures += "tree reads ($($ch.loads)) exceed WebSocket frames ($($ch.frames)) plus the first read" }
          "### Org chart (#26, Dioxus)`n- menu: $($ch.menu -join ' / ')`n- orgbar: $($ch.bar) / $($ch.credits)`n- tree reads $($ch.loads), WebSocket frames $($ch.frames), idle: $($ch.idle | ConvertTo-Json -Compress)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          # #28: bandeja, preguntas, cola de atención y notificaciones nativas
          $at = $probe.attention
          if (-not $at) { $failures += 'the attention stage did not run' }
          else {
            $nlog = @($at.notifications)
            $decided = { param($kind, $decision) @($nlog | Where-Object { $_.type -eq 'notify' -and $_.kind -eq $kind -and $_.decision -eq $decision }).Count }
            # preferencias por tipo: sin foco se muestran la pregunta, el urgente y las dos banderas; la rutina no
            if ($at.minimized.minimized -ne $true) { $failures += "the main window did not minimize: $($at.minimized | ConvertTo-Json -Compress)" }
            if (-not $at.shownMinimized) { $failures += "notifications while minimized: $(($nlog | Where-Object { $_.type -eq 'notify' } | ForEach-Object { "$($_.kind)=$($_.decision)" }) -join ', ')" }
            if ((& $decided 'routine' 'kind') -lt 1) { $failures += 'routine mail was not filtered by its preference' }
            if ($at.routineShown -ne $true -or $at.routineRetracted -ne $true) { $failures += "All mail on/off: shown $($at.routineShown), retracted $($at.routineRetracted)" }
            # con la ventana al frente, un urgente nuevo espera hasta prender notifyWhileFocused
            if ($at.restored.focused -ne $true -or $at.focusedHeld -ne $true -or $at.focusedShown -ne $true) { $failures += "focus filter: restored $($at.restored | ConvertTo-Json -Compress), held $($at.focusedHeld), shown $($at.focusedShown)" }
            # deduplicación: cada notificación se muestra una sola vez
            $twice = @($nlog | Where-Object { $_.type -eq 'notify' -and $_.decision -eq 'shown' } | Group-Object id | Where-Object { $_.Count -gt 1 })
            if ($twice.Count) { $failures += "notifications shown more than once: $(($twice | ForEach-Object Name) -join ', ')" }
            if ((& $decided 'urgent-mail' 'duplicate') + (& $decided 'question' 'duplicate') -lt 1) { $failures += 'no repeated pass was deduplicated' }
            # parpadeo: empieza con una llegada nueva sin foco y para cuando no queda nada
            $flash = @($nlog | Where-Object { $_.type -eq 'attention' })
            if (-not @($flash | Where-Object { $_.pulse -eq 'Start' -and $_.started -eq $true -and $_.focused -eq $false }).Count) { $failures += "the taskbar did not flash for a new arrival: $($flash | ConvertTo-Json -Compress)" }
            if ($at.flashStopped -ne $true) { $failures += 'the taskbar flash did not stop when nothing was pending' }
            # el clic abre la pregunta en la cola de atención
            if ($at.click.clicked -ne $true -or $at.clickOpened -notlike 'question:*') { $failures += "notification click: $($at.click | ConvertTo-Json -Compress), opened $($at.clickOpened)" }
            if ($at.counts.unread -ne 3 -or $at.counts.asks -ne 1 -or $at.counts.attention -ne 5) { $failures += "inbox and attention counts: $($at.counts | ConvertTo-Json -Compress)" }
            if (@($at.rowKinds | Where-Object { $_ -eq 'ticket' }).Count -ne 2 -or @($at.rowKinds | Where-Object { $_ -eq 'mail' }).Count -ne 2 -or @($at.rowKinds | Where-Object { $_ -eq 'question' }).Count -ne 1) { $failures += "attention rows: $($at.rows -join ', ')" }
            # preguntas: responder y descartar
            if (@($at.askOptions).Count -ne 2 -or $at.askText -notlike '*pre-release de Dioxus*') { $failures += "question card: $($at.askText) / $($at.askOptions -join ', ')" }
            if ($at.answerToast -notlike '*resolved worker*' -or $at.questionGone -ne $true -or $at.questionRetracted -ne $true) { $failures += "answer: $($at.answerToast), gone $($at.questionGone), retracted $($at.questionRetracted)" }
            if ($at.dismissQuestionToast -notlike '*dismissed worker*' -or $at.question2Gone -ne $true) { $failures += "dismiss question: $($at.dismissQuestionToast), gone $($at.question2Gone)" }
            # mail urgente: leerlo lo marca leído y sigue a la vista mientras está elegido; responder
            if ($at.urgentReason -notlike '*CI est*rojo*' -or $at.urgentRead -ne 'retained' -or $at.replyToast -ne 'sent to worker') { $failures += "urgent mail: $($at.urgentReason) / $($at.urgentRead) / $($at.replyToast)" }
            # bandera: responder la baja sin cambiar el estado; descartar pasa el ticket a blocked
            if ($at.flagReason -notlike '*certificado de prueba*' -or $at.ticketReplyGone -ne $true -or $at.ticketReplied.status -ne 'in_progress' -or $at.ticketReplied.flagged -ne $false) { $failures += "ticket reply: $($at.flagReason) / $($at.ticketReplied | ConvertTo-Json -Compress)" }
            if ($at.dismissGoneAtOnce -ne $true -or $at.dismissToast -notlike '*status: blocked' -or $at.ticketDismissed.status -ne 'blocked' -or $at.ticketDismissed.flagged -ne $false) { $failures += "ticket dismiss: $($at.dismissToast) / $($at.ticketDismissed | ConvertTo-Json -Compress)" }
            # bandeja: leer y archivar al salir, responder y Mark all read
            if ($at.routineOpened -notlike '*README*' -or $at.routineArchived -ne $true -or $at.inboxReplyToast -ne 'sent to worker' -or $at.urgent2Read -ne $true -or $at.allRead -ne $true -or $at.inboxClosed -ne $true) { $failures += "inbox: opened $($at.routineOpened), archived $($at.routineArchived), reply $($at.inboxReplyToast), read $($at.urgent2Read), all read $($at.allRead)" }
            if ($at.empty -notlike 'Pending questions*') { $failures += "attention queue not empty at the end: $($at.rowsAfter -join ', ')" }
          }
          "### Inbox, questions and attention (#28, Dioxus)`n- notifications: $(($nlog | Where-Object { $_.type -eq 'notify' -and $_.decision -ne 'focused' } | ForEach-Object { "$($_.kind)=$($_.decision)" }) -join ', ')`n- taskbar: $(($flash | ForEach-Object { "$($_.pulse)$(if ($_.started) { ' (flash)' })" }) -join ', ')`n- click: $($at.click | ConvertTo-Json -Compress) -> $($at.clickOpened)`n- rows: $($at.rows -join ', ')`n- tickets: replied $($at.ticketReplied | ConvertTo-Json -Compress), dismissed $($at.ticketDismissed | ConvertTo-Json -Compress)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          # #12: desk en RSX
          $desk = $probe.desk
          foreach ($check in 'opened', 'toolShown', 'markdownBold', 'markdownList', 'injectionBlocked') {
            if ($desk.$check -ne $true) { $failures += "desk.$check was $($desk.$check)" }
          }
          if (-not ($desk.live.later -gt $desk.live.first)) { $failures += "no live node_stream updates in the desk: $($desk.live | ConvertTo-Json -Compress)" }
          if ($desk.oldestLoaded -ne 1 -or $desk.domRows -lt 1000) { $failures += "long conversation not fully loaded: oldest $($desk.oldestLoaded), rows $($desk.domRows)" }
          if (-not $desk.scroll -or $desk.scroll.frames -lt 30) { $failures += "scroll was not measured: $($desk.scroll | ConvertTo-Json -Compress)" }
          "### Desk scroll (WebView2, Dioxus, $($desk.domRows) rows)`n$($desk.scroll | ConvertTo-Json -Compress)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          # #27: desk completo
          $full = $probe.deskFull
          if (-not $full) { $failures += 'the full desk stage did not run' }
          else {
            foreach ($check in 'segmentText', 'mailBold', 'thinkingOpens', 'notNavigated', 'stopShown', 'stillWorking', 'slotBannerGone',
                               'queuedMarkGone', 'crossCancelled', 'directSwitch', 'directBack', 'halted', 'unhalted', 'haltedBannerGone') {
              if ($full.$check -ne $true) { $failures += "deskFull.$check was $($full.$check)" }
            }
            # contenido: mail con respuesta citada y adjunto, avisos, pensamiento y enlaces a archivos
            if (($full.mailFrom -join ',') -ne 'User,jefe') { $failures += "mail senders: $($full.mailFrom -join ', ')" }
            if ($full.replyQuote -ne 'Respuesta 2: la tarea 0 avanza.') { $failures += "quoted reply: $($full.replyQuote)" }
            if ($full.attachment -notlike '*informe.txt*') { $failures += "attachment: $($full.attachment)" }
            if ($full.notice -notlike 'Aviso: el l*mite de turnos sub*a 16.') { $failures += "notice segment: $($full.notice)" }
            if ($full.thinking -notlike '*thought for 5s*') { $failures += "thinking line: $($full.thinking)" }
            if ($full.mailTime -match 'T\d\d:\d\d' -or -not $full.mailTime) { $failures += "mail time is not local: $($full.mailTime)" }
            if (@($full.localLinks | Where-Object { $_ -like '*:\*' }).Count -ne 2) { $failures += "local file links: $($full.localLinks -join ', ')" }
            if (-not ($full.pendingAtOpen -ge 1)) { $failures += "no pending mail rows: $($full.pendingAtOpen)" }
            # revelar: rutas relativas o inexistentes se muestran como texto, nunca se abren
            if ($full.revealRelative -ne 'Not an absolute path: uploads/informe.txt') { $failures += "relative path reveal: $($full.revealRelative)" }
            if ($full.revealMissing -notlike 'No such file:*falta.log') { $failures += "missing file reveal: $($full.revealMissing)" }
            # estado del turno: en cola por el límite (con la explicación), trabajando con STOP, detenido con reanudar
            if ($full.idle -ne 'Idle' -or $full.queued -ne 'Queued' -or $full.working -ne 'Active' -or $full.idleAgain -ne 'Idle') { $failures += "turn states: idle $($full.idle), queued $($full.queued), working $($full.working), idle again $($full.idleAgain)" }
            if ($full.slotBanner -notlike '*concurrency limit (16)*') { $failures += "turn-slot banner: $($full.slotBanner)" }
            if ($full.stopResult -notlike 'error:*no provider call*') { $failures += "STOP result: $($full.stopResult)" }
            if ($full.haltedBanner -notlike '*mail is stored unread until this agent is explicitly unhalted*') { $failures += "halted banner: $($full.haltedBanner)" }
            # enviar: el mensaje queda aceptado en el buzón, también a mitad de turno y detenido
            if ($full.sendMidTurn.pending -ne $true -or $full.sendMidTurn.cleared -ne $true -or $full.sendMidTurn.mode -ne 'queued (1 ahead)') { $failures += "send mid-turn: $($full.sendMidTurn | ConvertTo-Json -Compress)" }
            if ($full.sendHalted.pending -ne $true -or $full.sendHalted.mode -notlike 'halted * mail stays unread until unhalt') { $failures += "send while halted: $($full.sendHalted | ConvertTo-Json -Compress)" }
            # modelo: en cola a mitad de turno, cancelar, y confirmación entre proveedores
            if ($full.queueTitle -ne "queue worker's switch to sonnet?" -or $full.queuedToast -notlike 'QUEUED, not switched*' -or $full.queuedMark -ne "$([char]0x2192)S") { $failures += "queued switch: $($full.queueTitle) / $($full.queuedToast) / $($full.queuedMark)" }
            if ($full.cancelToast -notlike 'CANCELLED the queued switch*') { $failures += "cancel queued switch: $($full.cancelToast)" }
            if ($full.crossTitle -ne 'move worker from Claude to Codex?' -or $full.crossBody -notlike '*knowledge bearer worker@0*') { $failures += "cross-provider confirm: $($full.crossTitle)" }
            # esfuerzo
            if (($full.effortLevels -join ',') -ne 'low,medium,high,xhigh,max' -or $full.effortAfter -ne 'low' -or $full.effortToast -notlike '*applies from its next turn') { $failures += "effort: $($full.effortLevels -join ',') / $($full.effortAfter) / $($full.effortToast)" }
          }
          if (@($full.linksShown | Where-Object { $_ -like 'Link: *' }).Count -lt 2) { $failures += "links in the desk: $($full.linksShown -join ', ')" }
          $browsersAfter = @(Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue).Count
          if ($browsersAfter -gt $browsersBefore) { $failures += "a browser was opened during the smoke test ($browsersBefore -> $browsersAfter processes)" }
          $rv = $probe.reveal
          if ($rv.toast -notlike 'Shown in folder:*informe.txt' -or $rv.notNavigated -ne $true) { $failures += "reveal of an existing file: $($rv | ConvertTo-Json -Compress)" }
          Write-Host "Explorer windows after the reveal: $($ci.explorer)"
          "### Full desk (#27, Dioxus)`n- send: $($full.sendMidTurn | ConvertTo-Json -Compress) / halted: $($full.sendHalted | ConvertTo-Json -Compress)`n- turn: $($full.idle) / $($full.queued) / $($full.working) / halted $($full.halted)`n- reveal: $($full.revealRelative) / $($full.revealMissing) / $($rv.toast)`n- explorer windows: $($ci.explorer) (folder shown: $($ci.revealedFolder))" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          # #13: desk en otra ventana nativa, borrador compartido y cierre de la principal
          $mw = $probe.multiwindow
          if ($mw.composer -ne $true) { $failures += 'no composer in the desk' }
          if ($mw.mirroredFromPopout -ne $true) { $failures += "the main window did not get the popout's draft: $($mw.mainDraft)" }
          $pop = $probe.popout
          if ($pop.opened -ne $true) { $failures += "the desk window did not open: $($pop | ConvertTo-Json -Compress)" }
          if (-not ($pop.messages -gt 0)) { $failures += 'the desk window shows no messages' }
          if ($pop.mirroredFromMain -ne $true) { $failures += "the desk window did not get the main window's draft" }
          if ($pop.fontFamily -notlike '*Segoe UI*') { $failures += "renderer CSS not applied in the desk window: $($pop.fontFamily)" }
          if ($pop.bridge -ne 'undefined') { $failures += "a desktop bridge leaked into the desk window: $($pop.bridge)" }
          $oc = $probe.owner_close
          if ($oc.main_visible -ne $false) { $failures += "main window still visible after close: $($oc.main_visible)" }
          if ($oc.popouts -ne 1) { $failures += "desk windows after closing the main one: $($oc.popouts)" }
          $after = $probe.popout_after_owner_close
          if ($after.alive -ne $true -or $after.draft -ne 'escrito en el popout') { $failures += "the desk window did not survive the main close: $($after | ConvertTo-Json -Compress)" }
          # #14: ventana sin marco, botones, notificación, bandeja, arrastre e instancia única
          $nat = $probe.native
          if ($nat.shell.decorated -ne $false) { $failures += "main window is decorated: $($nat.shell.decorated)" }
          Write-Host "Frame: $($ci.frame)"
          if ($ci.framed -ne $false) { $failures += "main window has a native frame: $($ci.frame)" }
          if ($nat.page.controls -lt 3) { $failures += "window controls in RSX: $($nat.page.controls)" }
          foreach ($check in 'maximized', 'restored') {
            if ($nat.page.$check -ne $true) { $failures += "native.$check was $($nat.page.$check)" }
          }
          if ($nat.shell.notify -ne $true) { $failures += 'the native notification failed' }
          if ($nat.shell.tray -ne $true) { $failures += 'no tray icon' }
          $moved = "dx $($ci.dx), dy $($ci.dy) (at $($ci.at), region $($nat.page.drag.region)) $($ci.dragError)"
          Write-Host "Drag: $moved"
          if (-not ($ci.dx -ge 60 -and $ci.dy -ge 30)) { $failures += "dragging the header did not move the window: $moved" }
          $to = $probe.tray_only
          if ($to.main_visible -ne $false -or $to.popouts -ne 0 -or $ci.aliveInTray -ne $true) { $failures += "with every window closed the app should stay in the tray: $($to | ConvertTo-Json -Compress), alive $($ci.aliveInTray)" }
          if ($ci.secondExited -ne $true) { $failures += 'the second instance did not exit' }
          $si = $probe.second_instance
          if (-not $si -or $si.main_visible -ne $true) { $failures += "the second instance did not bring back the main window: $($si | ConvertTo-Json -Compress)" }
          "### Native window (#14, Dioxus)`n- drag: $moved`n- second instance: $($si | ConvertTo-Json -Compress)`n- scale: $($nat.shell.scale)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if (-not $exited) { $failures += 'the app did not exit after Quit'; Stop-Process -Id $p.Id -Force }
          else {
            Write-Host "App exited by itself with code $($p.ExitCode)"
            $enginePort = (Get-Content $port -Raw | ConvertFrom-Json).port
            $tcp = New-Object System.Net.Sockets.TcpClient
            try { $tcp.Connect('127.0.0.1', [int]$enginePort); $failures += "the engine is still listening on $enginePort after the app exited" } catch { Write-Host "Engine stopped with the app (port $enginePort closed)" } finally { $tcp.Dispose() }
          }
          if ($failures) { throw ($failures -join '; ') }
          Write-Host "Home window, org chart, inbox and attention, full desk, desk window and native integration in RSX verified in WebView2"

      # #24: el instalador generado, instalado en silencio en una carpeta descartable
      # y arrancado desde ahí sin ORGTREE_DIOXUS_PYTHON: el motor, el runtime y
      # PostgreSQL empaquetados, sobre una raíz de datos nueva y descartable.
      #
      # La app corre como un usuario local estándar creado para la prueba, como
      # una persona real. La cuenta del runner (runneradmin) es el Administrador
      # integrado de Windows (RID 500), cuyo SID Windows escribe como el alias
      # "LA" en SDDL: la verificación de ACL de pg-custodian (prototype-guard,
      # parse_sddl) no reconoce el alias y rechaza la carpeta de secretos del
      # clúster (acl.not_owner_only). Además corre elevada, y PostgreSQL no corre
      # con un token de administrador. Con un usuario estándar no pasa ninguna de
      # las dos cosas y el producto no cambia.
      - name: Install the NSIS installer and start the installed app (packaged engine on PostgreSQL)
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "no NSIS installer in dist" }
          $target = Join-Path $env:RUNNER_TEMP 'orgtree-dioxus-installed'
          # /D= va último y sin comillas (NSIS).
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "the installer exited with $($setup.ExitCode)" }
          $exe = Join-Path $target 'orgtree-dioxus.exe'
          $resources = Join-Path $target 'resources'
          foreach ($file in $exe, "$resources\engine\launch.py", "$resources\engine\runtime\python.exe", "$resources\engine\pg-custodian.exe",
                   "$resources\engine\postgresql\bin\postgres.exe", "$resources\engine\mailhub\mailhub\serve.py", "$resources\tools\pypg\pgimport.py",
                   "$resources\tools\pypg\cutover_verify.py", "$resources\build-info.json") {
            if (-not (Test-Path $file -PathType Leaf)) { throw "not installed: $file" }
          }
          if (Test-Path "$resources\ui") { throw "the React renderer should not be in the installer" }
          $installedMb = (Get-ChildItem $target -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Installed to {0}: {1:N1} MB" -f $target, $installedMb)
          # La disposición instalada, con las verificaciones del preflight de Electron.
          Push-Location $env:GITHUB_WORKSPACE
          $engineDir = ("$resources\engine" -replace '\\', '/')
          node --input-type=module -e "import { assertRuntimeLayout, runtimeTreeDigest } from './tools/runtime-layout.mjs'; import { assertPostgresRuntime } from './tools/postgres-layout.mjs'; assertRuntimeLayout('$engineDir/runtime', { label: 'installed runtime' }); const installed = runtimeTreeDigest('$engineDir/runtime'), staged = runtimeTreeDigest('apps/desktop-dioxus/target/bundle-resources/engine/runtime'); if (installed.sha256 !== staged.sha256) throw new Error('installed runtime differs from the staged one'); console.log('installed runtime ok', JSON.stringify(installed), JSON.stringify(assertPostgresRuntime('$engineDir')))"
          if ($LASTEXITCODE -ne 0) { throw "installed layout check failed" }
          Pop-Location

          # Un usuario local estándar (no administrador) con su propio perfil.
          $user = 'orgtreespike'
          # 14 caracteres como máximo: con más, net user pide confirmación.
          $password = 'Ot1!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          net user $user $password /add | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "could not create the local user $user" }
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          # Como una instalación por usuario: la carpeta es del usuario que la usa.
          icacls $target /grant "${user}:(OI)(CI)M" /Q | Out-Null
          $run = Join-Path $env:RUNNER_TEMP 'orgtree-dioxus-installed-run'
          New-Item -ItemType Directory -Force $run | Out-Null
          icacls $run /grant "${user}:(OI)(CI)F" /Q | Out-Null
          $data = Join-Path $run 'data'
          $probeFile = Join-Path $run 'probe.json'
          function Start-AsUser([string]$file, [string]$arguments, [hashtable]$vars, [string]$cwd) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new($file, $arguments)
            $psi.UseShellExecute = $false; $psi.LoadUserProfile = $true; $psi.WorkingDirectory = $cwd
            $psi.UserName = $user; $psi.Domain = $env:COMPUTERNAME; $psi.Password = $secure
            # Sin el modo de desarrollo: la app tiene que encontrar sus recursos sola.
            foreach ($name in 'ORGTREE_DIOXUS_PYTHON', 'ORGTREE_DIOXUS_ENGINE_DIR', 'ORGTREE_DATA', 'ORGTREE_PG_BOOTSTRAP') { [void]$psi.Environment.Remove($name) }
            foreach ($name in $vars.Keys) { $psi.Environment[$name] = $vars[$name] }
            [System.Diagnostics.Process]::Start($psi)
          }
          # Crear el perfil y leer dónde quedó.
          $first = Start-AsUser 'cmd.exe' '/d /c exit 0' @{} $run
          $first.WaitForExit()
          $sid = ([System.Security.Principal.NTAccount]::new($user)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $userDir = (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid").ProfileImagePath
          Write-Host "Standard user $user ($sid), profile $userDir"
          $userVars = @{
            USERNAME = $user; USERPROFILE = $userDir; HOMEDRIVE = $userDir.Substring(0, 2); HOMEPATH = $userDir.Substring(2)
            APPDATA = "$userDir\AppData\Roaming"; LOCALAPPDATA = "$userDir\AppData\Local"
            TEMP = "$userDir\AppData\Local\Temp"; TMP = "$userDir\AppData\Local\Temp"
          }
          New-Item -ItemType Directory -Force $userVars.TEMP, $userVars.APPDATA | Out-Null
          $appVars = $userVars + @{ ORGTREE_DIOXUS_DATA = $data; ORGTREE_DIOXUS_PROBE = $probeFile; ORGTREE_DIOXUS_PROBE_MODE = 'installed' }

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\screens" | Out-Null
            $bitmap.Save("$env:RUNNER_TEMP\screens\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose()
          }
          # El runner trae PGPASSWORD y PGUSER (su PostgreSQL preinstalado): la app
          # las recibe y no tiene que pasárselas al motor.
          Write-Host "libpq variables in the app's environment: $((Get-ChildItem Env:PG* | ForEach-Object Name) -join ', ')"
          $started = Get-Date
          $p = Start-AsUser $exe '' $appVars $target
          $deadline = (Get-Date).AddSeconds(300)
          $shot = $false; $splash = $false
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            if (-not $splash -and ((Get-Date) - $started).TotalSeconds -ge 4) {
              try { Save-Screen 'installed-splash' } catch { Write-Host "screenshot: $_" }; $splash = $true
            }
            if (-not $shot -and (Test-Path "$probeFile.installed")) {
              try { Save-Screen 'installed' } catch { Write-Host "screenshot: $_" }; $shot = $true
            }
            Start-Sleep -Milliseconds 300; $p.Refresh()
          }
          $seconds = [int]((Get-Date) - $started).TotalSeconds
          $exited = $p.HasExited
          if (-not $exited) { try { Save-Screen 'installed-timeout' } catch {}; taskkill /PID $p.Id /T /F | Out-Null }

          $failures = @()
          $raw = if (Test-Path $probeFile) { Get-Content $probeFile -Raw } else { '{}' }
          Write-Host "Installed app probe: $raw"
          "### Installed app (#24, Dioxus)`n``````json`n$raw`n``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $probe = $raw | ConvertFrom-Json
          if (-not $probe.installed) { $failures += "the installed app did not load its UI (startup status: $($probe.startup_status))" }
          $ui = $probe.installed
          foreach ($check in 'card', 'orgList', 'empty') {
            if ($ui.$check -ne $true) { $failures += "installed.$check was $($ui.$check)" }
          }
          if ($ui.orgs -ne 0) { $failures += "a fresh data root should have no orgs: $($ui.orgs)" }
          if ($ui.version -ne '0.0.1') { $failures += "version badge: $($ui.version)" }
          if ($ui.fontFamily -notlike '*Segoe UI*') { $failures += "renderer CSS not applied: $($ui.fontFamily)" }
          if ($ui.bridge -ne 'undefined') { $failures += "a desktop bridge leaked into the webview: $($ui.bridge)" }
          if ($ui.dataRoot -ne $data) { $failures += "the UI does not show the data root in use: $($ui.dataRoot)" }
          if ($ui.mode -notlike '*app instalada*') { $failures += "the UI does not say it is the installed app: $($ui.mode)" }
          $launch = $probe.launch
          if ($launch.packaged -ne $true -or $launch.bootstrap_postgres -ne $true) { $failures += "not the packaged launch: $($launch | ConvertTo-Json -Compress)" }
          if ($launch.python -ne "$resources\engine\runtime\python.exe") { $failures += "not the bundled runtime: $($launch.python)" }

          # El motor empaquetado levantó sobre PostgreSQL en la raíz descartable.
          $backend = Join-Path $data 'store-backend.json'
          if (Test-Path $backend) {
            $record = Get-Content $backend -Raw | ConvertFrom-Json
            Write-Host "store-backend.json: $($record | ConvertTo-Json -Compress)"
            if ($record.backend -ne 'postgres') { $failures += "store-backend.json chose $($record.backend)" }
          } else { $failures += "no store-backend.json in $data" }
          foreach ($path in "$data\pg\cluster\data\PG_VERSION", "$data\pg\cluster\instance.json", "$data\orgtree-product-root.json", "$data\engine-port.json") {
            if (-not (Test-Path $path)) { $failures += "missing $path" }
          }
          $pgVersion = if (Test-Path "$data\pg\cluster\data\PG_VERSION") { (Get-Content "$data\pg\cluster\data\PG_VERSION").Trim() } else { $null }
          Write-Host "PostgreSQL cluster version: $pgVersion"
          # El servidor del clúster propio arrancó y se apagó con la app.
          $pgLog = "$data\pg\cluster\log\postgres.log"
          if (Test-Path $pgLog) {
            Write-Host "===== postgres.log"; Get-Content $pgLog | Where-Object { $_ -notmatch 'skipping missing configuration file' } | Write-Host
            $pgText = Get-Content $pgLog -Raw
            if ($pgText -notmatch 'database system is ready to accept connections') { $failures += 'the bundled PostgreSQL never accepted connections' }
            if ($pgText -notmatch 'database system is shut down') { $failures += 'the bundled PostgreSQL did not shut down with the app' }
          } else { $failures += "missing $pgLog" }
          # El descriptor engine-paths.json, en la carpeta propia de la app.
          $paths = Join-Path $userVars.LOCALAPPDATA 'com.kushro.orgtree.dioxus-spike\engine-paths.json'
          if (Test-Path $paths) {
            $descriptor = Get-Content $paths -Raw | ConvertFrom-Json
            Write-Host "engine-paths.json: $($descriptor | ConvertTo-Json -Compress)"
            if ($descriptor.schema -ne 'orgtree.engine-paths/v1' -or $descriptor.data -ne $data -or $descriptor.custodian -ne "$resources\engine\pg-custodian.exe" -or $descriptor.pgBin -ne "$resources\engine\postgresql\bin") {
              $failures += "unexpected engine-paths.json: $($descriptor | ConvertTo-Json -Compress)"
            }
          } else { $failures += "no engine-paths.json at $paths" }
          if (Test-Path "$($userVars.APPDATA)\Orgtree v2") { $failures += "something was written to the installed Orgtree's data folder" }

          # Salir (como desde la bandeja) apaga el motor y PostgreSQL con la app.
          if (-not $exited) { $failures += "the installed app did not exit after the probe ($seconds s)" }
          else { Write-Host "Installed app exited by itself with code $($p.ExitCode) after $seconds s" }
          Start-Sleep -Seconds 3
          $left = @(Get-Process postgres, python, pg-custodian -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$target*" })
          if ($left) { $failures += "processes left from the installed app: $(($left | ForEach-Object { "$($_.Name) $($_.Id)" }) -join ', ')" }
          "### Installed app (#24)`n- installed size: $([math]::Round($installedMb, 1)) MB`n- first start (PostgreSQL $pgVersion init) to exit: $seconds s`n- run as the standard local user $user" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($failures) {
            Write-Host "===== files under $data"
            Get-ChildItem $data -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\pg\\cluster\\data\\' } | ForEach-Object { "{0} ({1} bytes)" -f $_.FullName, $_.Length }
            # Nunca los secretos del clúster (contraseñas de sus roles).
            foreach ($log in Get-ChildItem $data -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.log', '.txt', '.jsonl', '.json' -and $_.FullName -notmatch '\\secrets\\' -and $_.Length -lt 65536 } | Select-Object -First 25) {
              Write-Host "===== $($log.FullName)"; Get-Content $log.FullName -Tail 40
            }
            # La app descarta stdout y stderr del motor (pueden traer secretos). Para
            # diagnosticar, el mismo motor empaquetado a mano, como el mismo usuario,
            # sobre otra raíz descartable.
            $diag = Join-Path $run 'diagnostic'
            $engineVars = $userVars + @{ ORGTREE_DATA = $diag; ORGTREE_V2_TOKEN = 'diagnostic-only'; PYTHONUNBUFFERED = '1'; ORGTREE_PG_BOOTSTRAP = '1'
              ORGTREE_PG_CUSTODIAN = "$resources\engine\pg-custodian.exe"; ORGTREE_P03_PG_BIN = "$resources\engine\postgresql\bin" }
            # Sin las variables de libpq del runner (la app las quita sola).
            foreach ($name in 'PGPASSWORD', 'PGUSER') { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
            $d = Start-AsUser 'cmd.exe' "/d /c mkdir $diag && $resources\engine\runtime\python.exe $resources\engine\launch.py > $run\diagnostic-stdout.txt 2> $run\diagnostic-stderr.txt" $engineVars "$resources\engine"
            if (-not $d.WaitForExit(240000)) { Write-Host "diagnostic engine still running after 240 s"; taskkill /PID $d.Id /T /F | Out-Null }
            Write-Host "===== diagnostic engine stdout"; Get-Content "$run\diagnostic-stdout.txt" -Tail 60
            Write-Host "===== diagnostic engine stderr"; Get-Content "$run\diagnostic-stderr.txt" -Tail 120
            throw ($failures -join '; ')
          }
          Write-Host "Installed app verified: packaged engine on PostgreSQL, RSX UI loaded, own data root shown"

      - name: Report sizes
        shell: pwsh
        run: |
          $app = Get-ChildItem target -Recurse -Filter orgtree-dioxus.exe |
            Where-Object { $_.FullName -match '\\release\\' } | Select-Object -First 1
          "### Sizes (Dioxus)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          @(Get-ChildItem dist -Recurse -Filter *.exe) + @($app) |
            ForEach-Object { "- {0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) } |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $staged = 'target\bundle-resources'
          foreach ($part in 'engine\runtime', 'engine\postgresql', 'engine') {
            $mb = (Get-ChildItem "$staged\$part" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
            "- resources\{0} (uncompressed): {1:N1} MB" -f $part, $mb | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orgtree-dioxus-screens
          path: ${{ runner.temp }}/screens/*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: orgtree-dioxus-installed-logs
          path: |
            ${{ runner.temp }}/orgtree-dioxus-installed-run/**/*.log
            ${{ runner.temp }}/orgtree-dioxus-installed-run/**/*.txt
            ${{ runner.temp }}/orgtree-dioxus-installed-run/**/*.jsonl
            ${{ runner.temp }}/orgtree-dioxus-installed-run/**/*.json
            !${{ runner.temp }}/orgtree-dioxus-installed-run/**/secrets/**
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: orgtree-dioxus-installer
          path: apps/desktop-dioxus/dist/*.exe
          if-no-files-found: error

  # #24: solo a mano (workflow_dispatch con prerelease), nunca en un push. Un
  # pre-release de la rama con su propio tag; main y los releases normales no se tocan.
  prerelease:
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orgtree-dioxus-installer
          path: installer

      - name: Publish the installer as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dioxus-preview-${{ github.run_number }}
        run: |
          set -euo pipefail
          installer=$(ls installer/*.exe | head -n 1)
          size=$(du -m "$installer" | cut -f1)
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          cat > notes.md <<EOF
          Vista previa del spike de migración a **Dioxus** (rama \`spike/dioxus\`, commit \`$short\`, [run $GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)).

          **No es un release oficial de Orgtree.** Es un pre-release para probar el spike a mano en Windows.

          ## Qué incluye
          - La app de escritorio en Dioxus 0.7 (UI en RSX con el CSS del renderer de Orgtree).
          - El motor Python de Orgtree (\`engine/\`, con el submódulo \`engine/mailhub\`) y su runtime de Python 3.13 embebido.
          - PostgreSQL 18 y \`pg-custodian\`: en el primer arranque la raíz de datos nace en PostgreSQL.
          - El instalador baja WebView2 solo si falta.

          ## Datos
          La app usa su propia raíz de datos, \`%LOCALAPPDATA%\\com.kushro.orgtree.dioxus-spike\\data\`, y la muestra en la pantalla de inicio. Nunca usa ni toca la de Orgtree instalado (\`%APPDATA%\\Orgtree v2\\data\`). Desinstalar la app no borra esa carpeta.

          Instalador: \`$(basename "$installer")\` ($size MB). Se instala por usuario, sin permisos de administrador.
          EOF
          gh release create "$TAG" "$installer" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Orgtree Dioxus (vista previa $GITHUB_RUN_NUMBER)" --notes-file notes.md
          echo "Pre-release $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
