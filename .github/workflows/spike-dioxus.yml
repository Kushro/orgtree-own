            if ($dk.blockedReason -notlike '*7-Zip*' -or -not ($dk.liveFrames -ge 1)) { $failures += "live blocked: $($dk.blockedReason), frames $($dk.liveFrames)" }
            if ($dk.droppedWhy -notlike '*docs/spikes*') { $failures += "dropped reason: $($dk.droppedWhy)" }
            # bandera: levantada por el agente, abierta desde la cola de atención y bajada por el usuario
            if ($dk.flagReason -notlike '*62,8 MB*' -or $dk.dismissToast -notlike '*status: blocked' -or $dk.dismissBlocked -notlike '*attention flag dismissed by the user*') { $failures += "flag: $($dk.flagReason) / $($dk.dismissToast) / $($dk.dismissBlocked)" }
            # pregunta adjunta, respondida desde el panel
            if ($dk.questionText -notlike '*Cierro este ticket*' -or $dk.answerToast -notlike "*resolved worker*") { $failures += "attached question: $($dk.questionText) / $($dk.answerToast)" }
            # asignar con Staff… (sin dueño: se contrata en el primer nivel)
            $mem = $dk.engine.items.($t.memoria)
            if ($dk.staffDisclosure -notlike 'Assignee unavailable*' -or $dk.staffToast -notlike 'Staffed*' -or -not $dk.staffedOwner -or $mem.owner -ne $dk.staffedOwner -or $mem.status -ne 'open') { $failures += "staff: $($dk.staffDisclosure) / $($dk.staffToast) / $($dk.staffedOwner) / engine $($mem | ConvertTo-Json -Compress)" }
            # lo que dice el motor al final
            $st = $dk.engine.items
