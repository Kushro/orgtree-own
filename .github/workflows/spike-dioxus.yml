            if ($su.orgShown.compact -ne '80' -or $os.compact_at -ne 70 -or $os.default_top_grant -ne 7 -or $os.default_effort -ne 'medium' -or $os.cascade_hire -ne $false -or $su.orgAfter.orgmd -notlike '# Charter de prueba*') { $failures += "org settings in the engine: $($su.orgAfter | ConvertTo-Json -Compress)" }
