            elseif ($lc.missing.phase -ne 'error' -or $lc.missing.error -ne 'not-installed' -or $lc.missing.started -ne $false) { $failures += "login of an undetected $($lc.missingId): $($lc.missing | ConvertTo-Json -Compress)" }
