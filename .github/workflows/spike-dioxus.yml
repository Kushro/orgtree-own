          }
          "### Docket (#29, Dioxus)`n- rows: $($dk.rows -join ', ')`n- totals: $($dk.totals.text) (with archived: $($dk.totalsWithArchived.text))`n- filters: blocked $($dk.blockedRows -join ', ') / jefe $($dk.jefeRows -join ', ') / unassigned $($dk.unassignedRows -join ', ')`n- detail: $($dk.detail | ConvertTo-Json -Compress)`n- actions: $($dk.commentToast) / $($dk.dismissToast) / $($dk.answerToast) / $($dk.staffToast)`n- explorer: $($ci.docketExplorer)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          # #30: ajustes de la org y de la app, filtro de tiers, proveedores, cuentas y login
          $su = $probe.setup
          if (-not $su) { $failures += 'the settings stage (#30) did not run' }
          else {
            foreach ($check in 'orgOpened', 'appOpened', 'loginStarting', 'loginCancelled', 'removed', 'appClosed', 'backInOrg', 'headlessUnchanged') {
              if ($su.$check -ne $true) { $failures += "setup.$check was $($su.$check)" }
            }
            # ajustes de la org: lo guardado está en el motor y el panel lo relee
