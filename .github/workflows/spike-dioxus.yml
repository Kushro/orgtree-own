            if ($dk.artifactToast -notlike 'Shown in folder:*medicion.txt' -or $dk.artifactFile.text -notlike 'runtime 62.8 MB*' -or $ci.docketRevealed -ne $true) { $failures += "artifact: $($dk.artifactToast) / $($dk.artifactFile | ConvertTo-Json -Compress) / explorer $($ci.docketExplorer)" }
