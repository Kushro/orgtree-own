            if (($d.artifacts -join ',') -ne 'medicion.txt' -or $d.artifactSummary -ne '1 of 40') { $failures += "artifacts: $($d.artifacts -join ', ') / $($d.artifactSummary)" }
            if (($d.holders -join ',') -ne 'jefe') { $failures += "earlier holders: $($d.holders -join ', ')" }
            if ($d.historyFolded -ne $true -or $d.history -notcontains 'assign' -or $d.history -notcontains 'decision' -or $d.history -notcontains 'evidence' -or $d.historyAssign -notlike '*from: jefe*to: worker*') { $failures += "history: $($d.history -join ', ') / $($d.historyAssign)" }
