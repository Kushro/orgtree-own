            if ($su.themeApplied -ne '#22c4bd' -or $su.themePrefs.visualTheme -ne 'codex' -or $su.themePrefs.visualThemeExplicit -ne $true -or $su.themeBack -ne '#d97757') { $failures += "theme: applied $($su.themeApplied), back $($su.themeBack), prefs $($su.themePrefs | ConvertTo-Json -Compress)" }
          }
