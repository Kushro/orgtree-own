name: Spike Dioxus

on:
  push:
    branches: [spike/dioxus]
    paths:
      - apps/desktop-dioxus/**
      - apps/desktop/renderer/src/styles.css
      - .github/workflows/spike-dioxus.yml
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publicar el instalador como pre-release de GitHub (tag dioxus-preview-<run_number>)'
        type: boolean
        default: false

concurrency:
  group: spike-dioxus-${{ github.ref }}
  cancel-in-progress: true

env:
  DIOXUS_CLI_VERSION: 0.7.10

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop-dioxus
    steps:
      # El submódulo engine/mailhub va en el instalador (#24).
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop-dioxus
            engine/native/pg-custodian -> ../../../artifacts/postgres-provision/cargo

      # Python para el motor real en modo de desarrollo (pruebas y smoke test) y para
      # aprovisionar el runtime embebido. Raíz de datos descartable, nunca datos reales.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.13'

      - name: Install engine dependencies
        run: python -m pip install -r ../../tools/runtime-requirements.in

      - name: Engine supervisor and client tests (fake and real engine)
        env:
          FAKE_ENGINE_PYTHON: ${{ steps.python.outputs.python-path }}
          ORGTREE_TEST_ENGINE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: cargo test -p orgtree-engine-host -p orgtree-engine-client -- --include-ignored --nocapture

      # #27: Markdown y enlaces a archivos, revelado (rutas relativas o inexistentes) y hora local
      - name: Desk unit tests
        run: cargo test -p orgtree-dioxus --bin orgtree-dioxus

      # #24: el runtime embebido y PostgreSQL 18, como el instalador de Electron.
      # El ZIP de PostgreSQL (~380 MB) queda en caché por el pin.
      - uses: actions/cache@v4
        with:
          path: .runtime-cache/*.zip
          key: runtime-cache-${{ hashFiles('tools/postgres-runtime-pin.json', 'tools/provision-runtime.py') }}

      - name: Provision the embedded Python runtime (engine/runtime)
        working-directory: .
        run: python tools/provision-runtime.py

      - name: Provision PostgreSQL and pg-custodian (engine/postgresql, engine/pg-custodian.exe)
        working-directory: .
        run: python tools/provision-postgres.py

      - name: Stage the installer resources
        working-directory: .
        run: python apps/desktop-dioxus/installer/stage_resources.py

      # Las mismas verificaciones de disposición que tools/package-preflight.mjs,
      # sobre lo que va al instalador.
      - name: Verify the staged runtime and PostgreSQL layout
        working-directory: .
        run: >-
          node --input-type=module -e "import { assertRuntimeLayout } from './tools/runtime-layout.mjs';
          import { assertPostgresRuntime } from './tools/postgres-layout.mjs';
          const engine = 'apps/desktop-dioxus/target/bundle-resources/engine';
          assertRuntimeLayout(engine + '/runtime', { label: 'staged runtime' });
          console.log('runtime ok', JSON.stringify(assertPostgresRuntime(engine, { sourceRoot: process.cwd() })))"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli@${{ env.DIOXUS_CLI_VERSION }} --no-confirm --force

      - name: Build installer
        id: build
        run: dx bundle --platform desktop --package-types nsis --release --out-dir dist

      - name: Smoke test (engine, home, org chart, inbox and attention, docket, settings and accounts, full desk, desk window and native integration in RSX)
        shell: pwsh
        env:
          ORGTREE_DIOXUS_PYTHON: ${{ steps.python.outputs.python-path }}
          # El motor real con una org sembrada (un agente con historial) y sin proveedores.
          ORGTREE_DIOXUS_ENGINE_DIR: ${{ github.workspace }}/apps/desktop-dioxus/fixture-engine
          ORGTREE_DIOXUS_DATA: ${{ runner.temp }}/orgtree-dioxus-smoke
          ORGTREE_DIOXUS_PROBE: ${{ runner.temp }}/orgtree-dioxus-probe.json
          # Desk en vivo (#12): frames node_stream simulados y una conversación larga.
          # Desk completo (#27): el fixture siembra mail, avisos, pensamiento y archivos,
          # y simula los estados del turno (POST /api/fixture/turn-state).
          # Bandeja y atención (#28): POST /api/fixture/attention hace que el agente le
          # escriba al usuario, le pregunte y levante la bandera en dos tickets.
          # Docket (#29): POST /api/fixture/docket siembra tickets por el ledger real y
          # hace que los agentes cambien un estado, levanten la bandera o pregunten.
          # Cuentas, proveedores y ajustes (#30): un `codex` falso en el PATH de la app.
          ORGTREE_FIXTURE_LIVE: '1'
          ORGTREE_FIXTURE_MESSAGES: '1200'
        run: |
          $exe = Get-ChildItem target -Recurse -Filter orgtree-dioxus.exe |
            Where-Object { $_.FullName -match '\\release\\' } | Select-Object -First 1
          if (-not $exe) { throw "orgtree-dioxus.exe not found" }
          Write-Host "Running $($exe.FullName)"
          # #30: un `codex` falso en el PATH de la app (el runner no trae harnesses). Repite
          # sus argumentos, avisa si recibió el token o la variable de la prueba (el shell
          # las quita) y tarda 30 s: si cancelar el login no mata el árbol, deja finished.txt.
          $fake = Join-Path $env:RUNNER_TEMP 'fake-harness'
          New-Item -ItemType Directory -Force $fake | Out-Null
          Set-Content -Path (Join-Path $fake 'codex.cmd') -Encoding ascii -Value @(
            '@echo off', 'echo fake-codex %*', 'if defined ORGTREE_V2_TOKEN echo token-leak',
            'if defined ORGTREE_DIOXUS_PROBE echo probe-leak', 'ping -n 30 127.0.0.1 >nul', 'echo done> "%~dp0finished.txt"')
          $env:PATH = "$fake;$env:PATH"
          # #27: ningún enlace del desk abre el navegador (Dioxus manda cada <a> clicado a webbrowser::open)
          $browsersBefore = @(Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue).Count
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen($name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\screens" | Out-Null
            $bitmap.Save("$env:RUNNER_TEMP\screens\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bitmap.Dispose()
          }
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class Win {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X, Y; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr h, ref POINT p);
            [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, IntPtr e);
          }
          '@
          $ci = @{}
          # #14: arrastrar la ventana con el mouse real desde el header (zona -webkit-app-region: drag)
          function Test-Drag {
            $probe = Get-Content $env:ORGTREE_DIOXUS_PROBE -Raw | ConvertFrom-Json
            $nat = $probe.native
            $hwnd = [IntPtr][long]$nat.shell.hwnd
            # tao deja WS_CAPTION (snap, animaciones) y quita la barra de título. Queda el borde
            # de redimensionado invisible de Windows (8 px por lado, dentro del rectángulo de la
            # ventana en el tao de Dioxus); una barra de título real suma unos 30 px de alto.
            $wr = New-Object Win+RECT; [void][Win]::GetWindowRect($hwnd, [ref]$wr)
            $cr = New-Object Win+RECT; [void][Win]::GetClientRect($hwnd, [ref]$cr)
            $ci.frame = "window $($wr.R - $wr.L)x$($wr.B - $wr.T), client $($cr.R)x$($cr.B)"
            $ci.framed = (($wr.B - $wr.T) - $cr.B) -ge 20
            $drag = $nat.page.drag
            if (-not $drag) { return }
            $before = New-Object Win+RECT; [void][Win]::GetWindowRect($hwnd, [ref]$before)
            $pt = New-Object Win+POINT; $pt.X = [int]($drag.x * $drag.dpr); $pt.Y = [int]($drag.y * $drag.dpr)
            [void][Win]::ClientToScreen($hwnd, [ref]$pt)
            [void][Win]::SetCursorPos($pt.X, $pt.Y); Start-Sleep -Milliseconds 200
            [Win]::mouse_event(0x2, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 200
            for ($i = 1; $i -le 10; $i++) { [void][Win]::SetCursorPos($pt.X + 12 * $i, $pt.Y + 6 * $i); Start-Sleep -Milliseconds 40 }
            [Win]::mouse_event(0x4, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 500
            $after = New-Object Win+RECT; [void][Win]::GetWindowRect($hwnd, [ref]$after)
            $ci.dx = $after.L - $before.L; $ci.dy = $after.T - $before.T; $ci.at = "$($pt.X),$($pt.Y)"
          }
          $deadline = (Get-Date).AddSeconds(540)
          $shots = @{}
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            # la prueba deja un marcador y espera 3 s: capturas del inicio, del organigrama
            # (contratación, menú de agente, agente detenido), del desk (scroll, contenido,
            # en cola por el límite de turnos, detenido) y de las dos ventanas
            # #28: la barra de tareas parpadeando (ventana minimizada), la cola tras el clic en
            # la notificación, el panel de un ticket con bandera y la bandeja
            # #29: el docket con el detalle de un ticket y con una bandera abierta desde la cola
            # #30: los ajustes de la org, el filtro de tiers, los proveedores, el login, el
            # runtime y el tema
            foreach ($name in 'home', 'chart-hire', 'chart-menu', 'chart', 'taskbar', 'notification-click', 'attention', 'inbox', 'docket', 'docket-flag', 'org-settings', 'hire-filter', 'providers', 'login', 'runtime', 'theme', 'desk', 'desk-content', 'desk-queued', 'desk-halted', 'popout') {
              if (-not $shots[$name] -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).$name")) {
                try { Save-Screen $name } catch { Write-Host "screenshot: $_" }; $shots[$name] = $true
              }
            }
            # #30: antes del enlace externo, contar los navegadores (ninguno abrió antes)
            if (-not $ci.externalBefore -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).external-before")) {
              $ci.externalBefore = $true
              $ci.browsersBeforeExternal = @(Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue).Count
              New-Item -ItemType File -Force "$($env:ORGTREE_DIOXUS_PROBE).external-before-done" | Out-Null
            }
            # #30: el enlace https del desk abrió el navegador del sistema en esa URL
            if (-not $shots['external'] -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).external")) {
              $shots['external'] = $true
              $until = (Get-Date).AddSeconds(15)
              do {
                Start-Sleep -Milliseconds 700
                $browser = Get-CimInstance Win32_Process | Where-Object { $_.Name -in 'msedge.exe', 'chrome.exe', 'firefox.exe' -and $_.CommandLine -like '*example.com/orgtree*' } | Select-Object -First 1
              } while (-not $browser -and (Get-Date) -lt $until)
              $ci.externalBrowser = [bool]$browser
              $ci.externalBrowserName = if ($browser) { $browser.Name } else { $null }
              try { Save-Screen 'external' } catch { Write-Host "screenshot: $_" }
            }
            # #27: revelar un archivo abre su carpeta con el archivo seleccionado (explorer /select,)
            if (-not $shots['reveal'] -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).reveal")) {
              $shots['reveal'] = $true
              Start-Sleep -Milliseconds 1500
              try { Save-Screen 'reveal' } catch { Write-Host "screenshot: $_" }
              try {
                $explorer = @((New-Object -ComObject Shell.Application).Windows() | ForEach-Object { try { $_.Document.Folder.Self.Path } catch {} })
                $ci.explorer = $explorer -join ' | '
                $ci.revealedFolder = [bool]($explorer | Where-Object { $_ -and $_.TrimEnd('\') -like '*-fixture-files' })
                # cerrar esas ventanas para que no tapen el resto de la prueba
                (New-Object -ComObject Shell.Application).Windows() | Where-Object { try { $_.Document.Folder.Self.Path -like '*-fixture-files*' } catch { $false } } | ForEach-Object { $_.Quit() }
              } catch { $ci.explorer = "error: $_" }
            }
            # #29: guardar un artefacto lo deja en Descargas y abre su carpeta con el archivo seleccionado
            if (-not $shots['docket-artifact'] -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).docket-artifact")) {
              $shots['docket-artifact'] = $true
              Start-Sleep -Milliseconds 1500
              try { Save-Screen 'docket-artifact' } catch { Write-Host "screenshot: $_" }
              try {
                $explorer = @((New-Object -ComObject Shell.Application).Windows() | ForEach-Object { try { $_.Document.Folder.Self.Path } catch {} })
                $ci.docketExplorer = $explorer -join ' | '
                $ci.docketRevealed = [bool]($explorer | Where-Object { $_ -and $_ -like '*\Downloads\Orgtree\spike-fixture\*' })
                (New-Object -ComObject Shell.Application).Windows() | Where-Object { try { $_.Document.Folder.Self.Path -like '*\Downloads\Orgtree*' } catch { $false } } | ForEach-Object { $_.Quit() }
              } catch { $ci.docketExplorer = "error: $_" }
            }
            if (-not $ci.native -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).native")) {
              $ci.native = $true
              try { Test-Drag } catch { $ci.dragError = "$_" }
              try { Save-Screen 'native' } catch { Write-Host "screenshot: $_" }
              New-Item -ItemType File "$($env:ORGTREE_DIOXUS_PROBE).native-done" | Out-Null
            }
            # Sin ventanas visibles la app sigue en la bandeja; una segunda ejecución la vuelve a mostrar.
            if (-not $ci.tray -and (Test-Path "$($env:ORGTREE_DIOXUS_PROBE).tray")) {
              $ci.tray = $true
              $p.Refresh(); $ci.aliveInTray = -not $p.HasExited
              $second = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -ArgumentList '--second' -PassThru
              $ci.secondExited = $second.WaitForExit(20000)
              if (-not $ci.secondExited) { $second.Kill() }
              Start-Sleep -Milliseconds 800
              try { Save-Screen 'second-instance' } catch { Write-Host "screenshot: $_" }
            }
            Start-Sleep -Milliseconds 300; $p.Refresh()
          }
          # Salir (como desde la bandeja) termina la app, y con ella el motor.
          $exited = $p.HasExited
          if (-not (Test-Path $env:ORGTREE_DIOXUS_PROBE)) { throw "the WebView2 probe did not report" }
          $port = Join-Path $env:ORGTREE_DIOXUS_DATA 'engine-port.json'
          if (-not (Test-Path $port)) { throw "the app did not start the engine ($port missing)" }
          Write-Host "Engine started by the app: $(Get-Content $port -Raw)"
          $raw = Get-Content $env:ORGTREE_DIOXUS_PROBE -Raw
          Write-Host "WebView2 probe: $raw"
          "### WebView2 probe (Dioxus)`n``````json`n$raw`n``````" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $probe = $raw | ConvertFrom-Json
          $failures = @()
          if ($probe.error) { $failures += "probe error: $($probe.error)" }
          # #11: página de inicio en RSX con datos del cliente Rust
          $hp = $probe.home
          foreach ($check in 'card', 'orgListed', 'orgOpened', 'agentShown') {
            if ($hp.$check -ne $true) { $failures += "home.$check was $($hp.$check)" }
          }
          if ($hp.version -ne '0.0.1') { $failures += "version badge: $($hp.version)" }
          if ($hp.fontFamily -notlike '*Segoe UI*') { $failures += "renderer CSS not applied: $($hp.fontFamily)" }
          if ($hp.bridge -ne 'undefined') { $failures += "a desktop bridge leaked into the webview: $($hp.bridge)" }
          # #24: la raíz de datos en uso, a la vista en el inicio
          if ($hp.dataRoot -ne $env:ORGTREE_DIOXUS_DATA) { $failures += "data root not shown on the home card: $($hp.dataRoot)" }
          # #26: organigrama. Crear la org, contratar (el fixture declara un Claude stub),
          # detener y reanudar, mover y deshacer, retirar y recontratar, y borrar la org.
          $ch = $probe.chart
          foreach ($check in 'created', 'emptyTree', 'hiredTop', 'hiredSub', 'nested', 'externalShown', 'externalTop',
                             'halted', 'unhalted', 'interruptDisabledWhenIdle', 'moved', 'movedBack',
                             'retiredHidden', 'retiredShown', 'rehired', 'listed', 'deleted') {
            if ($ch.$check -ne $true) { $failures += "chart.$check was $($ch.$check)" }
          }
          if ($ch.orgName -ne 'Prueba Dioxus') { $failures += "org name in the orgbar: $($ch.orgName)" }
          if ($ch.bar -notlike '3 live*H3') { $failures += "orgbar agents chip: $($ch.bar)" }
          if ($ch.credits -ne "circulation 7 $([char]0xB7) seats 3 $([char]0xB7) free 4") { $failures += "orgbar credits: $($ch.credits)" }
          if ($ch.model -notlike 'claude-haiku*') { $failures += "model badge: $($ch.model)" }
          $ellipsis = [char]0x2026
          foreach ($entry in 'Open desk', "Hire a subordinate$ellipsis", "Move to$ellipsis", 'Interrupt (disabled)', 'Halt', "Retire$ellipsis") {
            if ($ch.menu -notcontains $entry) { $failures += "agent menu lacks '$entry': $($ch.menu -join ', ')" }
          }
          if ($ch.retireConfirm -notlike '*rehire brings it back*') { $failures += "retire confirm: $($ch.retireConfirm)" }
          if ($ch.missing) { $failures += "menu entries not found: $($ch.missing -join ', ')" }
          # sin sondeo: con la org quieta, cada relectura del árbol viene de un frame del WebSocket
          if (-not ($ch.idle.loads -le $ch.idle.frames)) { $failures += "the tree was re-read without a WebSocket frame: $($ch.idle | ConvertTo-Json -Compress)" }
          if (-not ($ch.loads -le $ch.frames + 1)) { $failures += "tree reads ($($ch.loads)) exceed WebSocket frames ($($ch.frames)) plus the first read" }
          "### Org chart (#26, Dioxus)`n- menu: $($ch.menu -join ' / ')`n- orgbar: $($ch.bar) / $($ch.credits)`n- tree reads $($ch.loads), WebSocket frames $($ch.frames), idle: $($ch.idle | ConvertTo-Json -Compress)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          # #28: bandeja, preguntas, cola de atención y notificaciones nativas
          $at = $probe.attention
          if (-not $at) { $failures += 'the attention stage did not run' }
          else {
            $nlog = @($at.notifications)
            $decided = { param($kind, $decision) @($nlog | Where-Object { $_.type -eq 'notify' -and $_.kind -eq $kind -and $_.decision -eq $decision }).Count }
            # preferencias por tipo: sin foco se muestran la pregunta, el urgente y las dos banderas; la rutina no
            if ($at.minimized.minimized -ne $true) { $failures += "the main window did not minimize: $($at.minimized | ConvertTo-Json -Compress)" }
            if (-not $at.shownMinimized) { $failures += "notifications while minimized: $(($nlog | Where-Object { $_.type -eq 'notify' } | ForEach-Object { "$($_.kind)=$($_.decision)" }) -join ', ')" }
            if ((& $decided 'routine' 'kind') -lt 1) { $failures += 'routine mail was not filtered by its preference' }
            if ($at.routineShown -ne $true -or $at.routineRetracted -ne $true) { $failures += "All mail on/off: shown $($at.routineShown), retracted $($at.routineRetracted)" }
            # con la ventana al frente, un urgente nuevo espera hasta prender notifyWhileFocused
            if ($at.restored.focused -ne $true -or $at.focusedHeld -ne $true -or $at.focusedShown -ne $true) { $failures += "focus filter: restored $($at.restored | ConvertTo-Json -Compress), held $($at.focusedHeld), shown $($at.focusedShown)" }
            # deduplicación: cada notificación se muestra una sola vez
            $twice = @($nlog | Where-Object { $_.type -eq 'notify' -and $_.decision -eq 'shown' } | Group-Object id | Where-Object { $_.Count -gt 1 })
            if ($twice.Count) { $failures += "notifications shown more than once: $(($twice | ForEach-Object Name) -join ', ')" }
            if ((& $decided 'urgent-mail' 'duplicate') + (& $decided 'question' 'duplicate') -lt 1) { $failures += 'no repeated pass was deduplicated' }
            # parpadeo: empieza con una llegada nueva sin foco y para cuando no queda nada
            $flash = @($nlog | Where-Object { $_.type -eq 'attention' })
            if (-not @($flash | Where-Object { $_.pulse -eq 'Start' -and $_.started -eq $true -and $_.focused -eq $false }).Count) { $failures += "the taskbar did not flash for a new arrival: $($flash | ConvertTo-Json -Compress)" }
            if ($at.flashStopped -ne $true) { $failures += 'the taskbar flash did not stop when nothing was pending' }
            # el clic abre la pregunta en la cola de atención
            if ($at.click.clicked -ne $true -or $at.clickOpened -notlike 'question:*') { $failures += "notification click: $($at.click | ConvertTo-Json -Compress), opened $($at.clickOpened)" }
            if ($at.counts.unread -ne 3 -or $at.counts.asks -ne 1 -or $at.counts.attention -ne 5) { $failures += "inbox and attention counts: $($at.counts | ConvertTo-Json -Compress)" }
            if (@($at.rowKinds | Where-Object { $_ -eq 'ticket' }).Count -ne 2 -or @($at.rowKinds | Where-Object { $_ -eq 'mail' }).Count -ne 2 -or @($at.rowKinds | Where-Object { $_ -eq 'question' }).Count -ne 1) { $failures += "attention rows: $($at.rows -join ', ')" }
            # preguntas: responder y descartar
            if (@($at.askOptions).Count -ne 2 -or $at.askText -notlike '*pre-release de Dioxus*') { $failures += "question card: $($at.askText) / $($at.askOptions -join ', ')" }
            if ($at.answerToast -notlike '*resolved worker*' -or $at.questionGone -ne $true -or $at.questionRetracted -ne $true) { $failures += "answer: $($at.answerToast), gone $($at.questionGone), retracted $($at.questionRetracted)" }
            if ($at.dismissQuestionToast -notlike '*dismissed worker*' -or $at.question2Gone -ne $true) { $failures += "dismiss question: $($at.dismissQuestionToast), gone $($at.question2Gone)" }
            # mail urgente: leerlo lo marca leído y sigue a la vista mientras está elegido; responder
            if ($at.urgentReason -notlike '*CI est*rojo*' -or $at.urgentRead -ne 'retained' -or $at.replyToast -ne 'sent to worker') { $failures += "urgent mail: $($at.urgentReason) / $($at.urgentRead) / $($at.replyToast)" }
            # bandera: responder la baja sin cambiar el estado; descartar pasa el ticket a blocked
            if ($at.flagReason -notlike '*certificado de prueba*' -or $at.ticketReplyGone -ne $true -or $at.ticketReplied.status -ne 'in_progress' -or $at.ticketReplied.flagged -ne $false) { $failures += "ticket reply: $($at.flagReason) / $($at.ticketReplied | ConvertTo-Json -Compress)" }
            if ($at.dismissGoneAtOnce -ne $true -or $at.dismissToast -notlike '*status: blocked' -or $at.ticketDismissed.status -ne 'blocked' -or $at.ticketDismissed.flagged -ne $false) { $failures += "ticket dismiss: $($at.dismissToast) / $($at.ticketDismissed | ConvertTo-Json -Compress)" }
            # bandeja: leer y archivar al salir, responder y Mark all read
            if ($at.routineOpened -notlike '*README*' -or $at.routineArchived -ne $true -or $at.inboxReplyToast -ne 'sent to worker' -or $at.urgent2Read -ne $true -or $at.allRead -ne $true -or $at.inboxClosed -ne $true) { $failures += "inbox: opened $($at.routineOpened), archived $($at.routineArchived), reply $($at.inboxReplyToast), read $($at.urgent2Read), all read $($at.allRead)" }
            if ($at.empty -notlike 'Pending questions*') { $failures += "attention queue not empty at the end: $($at.rowsAfter -join ', ')" }
          }
          "### Inbox, questions and attention (#28, Dioxus)`n- notifications: $(($nlog | Where-Object { $_.type -eq 'notify' -and $_.decision -ne 'focused' } | ForEach-Object { "$($_.kind)=$($_.decision)" }) -join ', ')`n- taskbar: $(($flash | ForEach-Object { "$($_.pulse)$(if ($_.started) { ' (flash)' })" }) -join ', ')`n- click: $($at.click | ConvertTo-Json -Compress) -> $($at.clickOpened)`n- rows: $($at.rows -join ', ')`n- tickets: replied $($at.ticketReplied | ConvertTo-Json -Compress), dismissed $($at.ticketDismissed | ConvertTo-Json -Compress)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          # #29: docket. Lista, casillas, filtros y totales sin archivados; detalle;
          # comentar, bajar la bandera, responder la pregunta adjunta y asignar; y los
          # cambios de los agentes (estado, bandera, pregunta) en vivo por el WebSocket.
          $dk = $probe.docket
          if (-not $dk) { $failures += 'the docket stage did not run' }
          else {
            $t = $dk.seed.tickets
