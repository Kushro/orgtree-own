<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orgtree (Tauri spike)</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { text-align: center; max-width: 36rem; padding: 1rem; }
    p { opacity: .75; }
    code { overflow-wrap: anywhere; }
    #phase { font-size: .85rem; opacity: .6; min-height: 1.2em; }
    #failure { text-align: left; border: 1px solid #c0504d; border-radius: 8px; padding: 1rem 1.25rem; }
    #failure h2 { margin: 0 0 .5rem; font-size: 1.15rem; }
    #failure p { opacity: .9; }
    #failure pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .8rem; opacity: .75; max-height: 12rem; overflow: auto; }
    .actions { display: flex; gap: .5rem; justify-content: flex-end; }
    button { font: inherit; padding: .4rem 1rem; border-radius: 6px; border: 1px solid #888; cursor: pointer; }
    button.primary { background: #2d5fa8; color: #fff; border-color: #2d5fa8; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Orgtree</h1>
    <div id="progress">
      <p id="status">Iniciando…</p>
      <p id="phase"></p>
    </div>
    <section id="failure" role="alert" hidden>
      <h2 id="failure-title"></h2>
      <p id="failure-message"></p>
      <pre id="failure-detail" hidden></pre>
      <div class="actions">
        <button id="quit" type="button">Salir</button>
        <button id="retry" class="primary" type="button">Reintentar</button>
      </div>
    </section>
    <p id="launch" hidden>Raíz de datos: <code id="data-root"></code><br><small id="mode"></small></p>
  </main>
  <script src="status.js"></script>
</body>
</html>
