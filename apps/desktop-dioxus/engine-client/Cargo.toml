[package]
name = "orgtree-engine-client"
version = "0.0.1"
description = "Cliente HTTP y WebSocket del motor de Orgtree (spike Dioxus)"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Solo loopback HTTP: sin TLS, para no sumar peso al binario.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }

[dev-dependencies]
orgtree-engine-host = { path = "../engine-host" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
